<title>现实纪元</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── 视觉基调：月结台账。宋体做标题（档案/红头文件的语感），
      等宽体做数字（工资条、对账单），朱砂只用于身份标识，从不用于数据。 ── */
:root{
  --paper:#efece4; --panel:#f6f4ee; --panel2:#e9e5da; --line:#d5cfc0; --line2:#c4bcaa;
  --ink:#23211d; --ink2:#5c574d; --ink3:#8b8578;
  --seal:#a83a30;                 /* 朱砂 · 只做结构与身份 */
  --gain:#4f7a58; --loss:#8a6440; --alarm:#a83a30; --note:#4a6480;
  --shadow:0 1px 2px rgba(35,33,29,.06);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141517; --panel:#1b1d21; --panel2:#232529; --line:#2e3137; --line2:#3d4149;
    --ink:#ddd9d1; --ink2:#98938a; --ink3:#6d6961;
    --seal:#c2554a;
    --gain:#6f9e78; --loss:#a8815a; --alarm:#c2554a; --note:#7d9ab8;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#141517; --panel:#1b1d21; --panel2:#232529; --line:#2e3137; --line2:#3d4149;
  --ink:#ddd9d1; --ink2:#98938a; --ink3:#6d6961;
  --seal:#c2554a;
  --gain:#6f9e78; --loss:#a8815a; --alarm:#c2554a; --note:#7d9ab8;
  --shadow:none;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 14px/1.75 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:26px 18px 70px}

h1{
  font-family:"Noto Serif SC",serif; font-weight:600; font-size:19px;
  letter-spacing:.22em; margin:0 0 6px; color:var(--ink);
}
h1::after{content:"";display:block;width:44px;height:2px;background:var(--seal);margin-top:9px}
.sub{color:var(--ink3);font-size:11.5px;letter-spacing:.1em;margin:10px 0 20px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}

.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:330px 1fr;gap:11px;align-items:start}
@media(max-width:840px){.grid{grid-template-columns:1fr}}

/* 台账表头 */
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  border-bottom:1.5px solid var(--line2);padding-bottom:8px;margin-bottom:11px}
.hd .t{font-family:"Noto Serif SC",serif;font-weight:600;font-size:16.5px;letter-spacing:.08em}
.hd .a{color:var(--ink3);font-size:11.5px;text-align:right;flex-shrink:0}

/* 台账行：标签左、数值右、等宽对齐 */
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;
  border-bottom:1px dotted var(--line)}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink3);flex:0 0 66px;letter-spacing:.04em}
.row .v{text-align:right;color:var(--ink);font-family:"IBM Plex Mono","Noto Sans SC",monospace;
  font-variant-numeric:tabular-nums;font-size:12.5px}

.bar{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:1px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;transition:width .4s ease}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.sect{margin-top:13px;padding-top:11px;border-top:1.5px solid var(--line2)}
.sect .h{font-size:10.5px;color:var(--ink3);letter-spacing:.24em;margin-bottom:8px}

.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
  border-radius:2px;padding:1px 8px;font-size:11.5px;color:var(--ink2);margin:0 4px 4px 0}
.chip.bad{color:var(--alarm);border-color:var(--alarm);background:transparent}

.sk{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:3px 0;
  border-bottom:1px dotted var(--line)}
.sk:last-child{border-bottom:none}
.sk .n{flex:0 0 34px;color:var(--ink3)}
.sk .w{color:var(--ink2);line-height:1.6}
.pbar{display:inline-block;width:52px;height:3px;background:var(--panel2);
  border:1px solid var(--line);border-radius:2px;overflow:hidden;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--note)}
.sk .w em{display:block;font-style:normal;color:var(--ink3);font-size:10.5px;
  font-family:"IBM Plex Mono",monospace;margin-top:1px}
.fam{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;
  border-bottom:1px dotted var(--line)}
.fam:last-of-type{border-bottom:none}
.fam .who{font-size:13px;color:var(--ink)}
.fam .who em{font-style:normal;color:var(--ink3);font-size:11.5px;margin-left:7px;
  font-family:"IBM Plex Mono",monospace}
.fam .hp{text-align:right;font-size:12px;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums}
.fam .job{grid-column:1 / -1;color:var(--ink3);font-size:11.5px;line-height:1.5}
.fam .job b{color:var(--alarm);font-weight:400}
.schnote{color:var(--ink3);font-size:11.5px;line-height:1.65;margin-top:9px;
  padding-left:9px;border-left:2px solid var(--line2)}

/* 时间流 */
.feedcard{padding-bottom:8px}
.scroll{max-height:min(52vh,440px);overflow-y:auto;overscroll-behavior:contain;padding-right:6px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.ent{padding:10px 0 12px;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:none}
.ent.cur{padding-left:11px;border-left:2px solid var(--seal);margin-left:-13px}
.month{font-size:11.5px;color:var(--ink3);letter-spacing:.12em;margin-bottom:6px;
  font-family:"IBM Plex Mono",monospace}
.ent.cur .month{color:var(--seal)}
.msg{padding:4px 0;white-space:pre-wrap;line-height:1.85;max-width:62ch}
.msg.hi{color:var(--seal)}
.empty{color:var(--ink3)}
.flow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;
  font-family:"IBM Plex Mono","Noto Sans SC",monospace;font-variant-numeric:tabular-nums}
.flow span{display:inline-block;margin:0 13px 3px 0;color:var(--ink3)}
.flow .p{color:var(--gain)} .flow .m{color:var(--loss)}
.rum{font-size:12.5px;padding:4px 0 4px 10px;margin-top:4px;display:flex;gap:8px;align-items:baseline;
  border-left:2px solid var(--line2)}
.rum .s{color:var(--note);flex:0 0 auto}
.rum .rt{flex:1;color:var(--ink2)}
.rum .st{color:var(--loss);flex:0 0 auto;letter-spacing:1px;font-size:11px}

/* 图表 */
.chart{margin:8px 0;overflow-x:auto}
.chart.empty{color:var(--ink3);font-size:12px;padding:22px 0;text-align:center;
  border:1px dashed var(--line2);border-radius:2px}
.ax{fill:var(--ink3);font-size:10px;font-family:"IBM Plex Mono",monospace}
.spk{flex:0 0 76px;display:block}

/* 行动 */
.verbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.verb{background:transparent;border:1px solid var(--line2);color:var(--ink2);
  padding:5px 14px;border-radius:2px;cursor:pointer;font-size:13px;font-family:inherit;transition:.14s}
.verb:hover{color:var(--ink);border-color:var(--ink3)}
.verb.on{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:500}
.verb.key{border-color:var(--ink3)}
.verb.key::before{content:"● ";color:var(--seal);font-size:9px;vertical-align:2px}
.verb.key.on::before{color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:580px){.acts{grid-template-columns:1fr}}
.act{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:9px 12px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;transition:.14s}
.act:hover{border-color:var(--seal)}
.act .hint{display:block;color:var(--ink3);font-size:11.5px;line-height:1.6;margin-top:3px}

.foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn{background:transparent;border:1px solid var(--line2);color:var(--ink2);padding:6px 14px;
  border-radius:2px;cursor:pointer;font-family:inherit;font-size:12.5px;transition:.14s}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.btn.main{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:500}
.btn.main:hover{color:#fff;filter:brightness(1.08)}
.btn:disabled{opacity:.3;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.sell{border-color:var(--alarm);color:var(--alarm)}
.note{color:var(--ink3);font-size:11.5px;line-height:1.6;margin-top:8px}
.lbl{color:var(--ink3);font-size:12.5px}
.tick{color:var(--ink3);font-size:11.5px;margin-left:auto;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.up{color:var(--gain)} .dn{color:var(--alarm)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line2);color:var(--ink);padding:8px 20px;border-radius:2px;font-size:13px;z-index:99}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,11,12,.72);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--seal);
  border-radius:3px;padding:21px 23px;max-width:570px;width:100%;max-height:86vh;overflow:auto}
.modal.wide{max-width:920px}
.mkhead{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.mkhead div{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:8px 11px}
.mkhead .lb{display:block;color:var(--ink3);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.mkhead b{font-family:"IBM Plex Mono","Noto Sans SC",monospace;font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums}
@media(max-width:700px){.mkhead{grid-template-columns:1fr 1fr}}
.mkgrid{display:grid;grid-template-columns:300px 1fr;gap:12px;margin-top:12px}
@media(max-width:760px){.mkgrid{grid-template-columns:1fr}}
.ilist{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow-y:auto}
.irow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:2px;padding:5px 7px;
  font-family:inherit;font-size:12.5px;color:var(--ink)}
.irow:hover{background:var(--panel2)}
.irow.on{background:var(--panel2);border-color:var(--seal)}
.irow.dead{opacity:.45}
.irow .nm{flex:1;min-width:0;line-height:1.35}
.irow .nm em{display:block;font-style:normal;color:var(--ink3);font-size:10.5px}
.irow .pxv{flex:0 0 52px;text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-size:12px}
.irow .hold{flex:0 0 52px;text-align:right;color:var(--ink3);font-size:11.5px;
  font-family:"IBM Plex Mono",monospace}
.idet{min-width:0}
.ihd{font-family:"Noto Serif SC",serif;font-size:15px;font-weight:600;margin-bottom:2px}
.ihd em{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:9px;font-family:"Noto Sans SC",sans-serif}
.blurb{color:var(--ink2);font-size:12.5px;padding:7px 11px;background:var(--panel2);
  border-left:2px solid var(--note);border-radius:0 2px 2px 0;margin:6px 0}
.mypos{font-size:12.5px;color:var(--ink2);margin:8px 0}
.tradebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mkmsg{margin-top:9px;font-size:12.5px;color:var(--seal)}
.modal h2{margin:0 0 4px;font-family:"Noto Serif SC",serif;font-size:16px;letter-spacing:.1em;color:var(--ink)}
.modal .tier{font-size:10.5px;color:var(--ink3);letter-spacing:.18em;margin-bottom:14px;
  font-family:"IBM Plex Mono",monospace}
.modal .body{white-space:pre-wrap;margin-bottom:17px;line-height:1.95;max-width:60ch}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);padding:11px 14px;border-radius:2px;cursor:pointer;margin-bottom:7px;
  font-family:inherit;font-size:13.5px;transition:.14s}
.opt:hover{border-color:var(--seal)}
.opt .s{display:block;color:var(--ink3);font-size:11.5px;margin-top:3px;
  font-family:"IBM Plex Mono","Noto Sans SC",monospace}


/* 岗位板：左栏滚动列表，右栏常驻详情 */
.modal.board{max-width:1000px}
.bgrid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start;margin-top:10px}
@media(max-width:820px){.bgrid{grid-template-columns:1fr}}
.bleft{max-height:min(56vh,520px);overflow-y:auto;padding-right:6px}
.bleft::-webkit-scrollbar{width:8px}
.bleft::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.bright{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line2);
  border-radius:3px;padding:14px 15px}

.jhead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;color:var(--ink3);letter-spacing:.2em;padding:4px 8px;margin-top:12px;
  border-bottom:1.5px solid var(--line2)}
.jhead:first-child{margin-top:0}
.jhead.lk{margin-top:20px}
.jhead .rt{letter-spacing:.08em}

.jr{display:grid;grid-template-columns:1fr 62px 46px;grid-template-areas:"t p c" "s s s";
  gap:1px 8px;width:100%;text-align:left;padding:7px 8px;border:1px solid transparent;
  border-left:2px solid transparent;border-radius:2px;font-family:inherit;font-size:13px;
  color:var(--ink);background:transparent}
button.jr{cursor:pointer}
button.jr:hover{background:var(--panel2)}
.jr.on{background:var(--panel2);border-color:var(--line2);border-left-color:var(--seal)}
.jr.lock{opacity:.66} .jr.unk{opacity:.42}
.jr .t{grid-area:t;line-height:1.4}
.jr .p{grid-area:p;text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-size:12.5px}
.jr .c{grid-area:c;text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--gain)}
.jr .p.dim,.jr .c.dim{color:var(--ink3);font-size:11px}
.jr .s{grid-area:s;color:var(--ink3);font-size:10.5px;line-height:1.5}
.jr .s i{font-style:normal;color:var(--loss)}
.jr .s em{font-style:normal;margin-left:8px}
.jr.f0{border-left-color:var(--gain)}
.jr.f0.on{border-left-color:var(--seal)}

.tag{font-style:normal;font-size:10px;padding:0 5px;margin-left:6px;border-radius:2px;
  border:1px solid currentColor;vertical-align:1px}
.tag.t0{color:var(--gain)} .tag.t1{color:var(--loss)} .tag.t2{color:var(--note)}

.jdn{font-family:"Noto Serif SC",serif;font-weight:600;font-size:15.5px;line-height:1.45}
.jmeta{color:var(--ink3);font-size:11px;margin-top:3px}
.jpay{margin:10px 0 8px;display:flex;align-items:baseline;gap:8px}
.jpay b{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500;
  font-variant-numeric:tabular-nums}
.jpay span{color:var(--ink3);font-size:11px}
.jtrack{font-size:11px;color:var(--seal);border:1px solid var(--seal);border-radius:2px;
  padding:2px 7px;display:inline-block;margin-bottom:8px}
.jblurb{color:var(--ink2);font-size:12.5px;line-height:1.8;padding-left:9px;
  border-left:2px solid var(--note);margin-bottom:8px}
.jtrap{color:var(--loss);font-size:12.5px;line-height:1.8;margin-bottom:10px}
.jempty{color:var(--ink3);font-size:12.5px;padding:10px 8px}
.btn.wide{width:100%;margin-top:4px}

.why{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.why span{font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid var(--line2);
  color:var(--ink3);font-family:"Noto Sans SC",sans-serif}
.why span b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums}
.why .p{color:var(--gain);border-color:color-mix(in srgb,var(--gain) 40%,transparent)}
.why .m{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 40%,transparent)}

/* 升职按钮：点之前就看得到下一格长什么样 */
.act.promo{grid-column:1 / -1;border-color:var(--seal);position:relative;padding-right:70px}
.act.promo .pr{position:absolute;right:12px;top:9px;font-family:"IBM Plex Mono",monospace;
  font-size:17px;color:var(--seal);font-variant-numeric:tabular-nums}
.act.promo .hint b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500}
.act.promo .hint.tr{color:var(--loss)}
.act.promo .hint.wy{color:var(--ink3);font-family:"IBM Plex Mono","Noto Sans SC",monospace;font-size:11px}
/* 点不了的晋升行：还在栏目里，但看得出来按不动 */
.act.promo.off{border-color:var(--line2);border-style:dashed;background:transparent;
  color:var(--ink3);cursor:default}
.act.promo.off .pr{color:var(--ink3);font-size:14px}

/* 开局 & 结局 */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
@media(max-width:660px){.pick{grid-template-columns:1fr}}
.pk{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:11px 13px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;transition:.14s}
.pk:hover{border-color:var(--ink3)}
.pk.on{border-color:var(--seal);border-left-width:3px}
.pk .d{display:block;color:var(--ink3);font-size:11.5px;line-height:1.65;margin-top:4px}
.pk .n{display:block;color:var(--loss);font-size:11.5px;line-height:1.65;margin-top:5px}
input[type=text]{background:var(--paper);border:1px solid var(--line2);color:var(--ink);
  padding:7px 10px;border-radius:2px;font-family:"IBM Plex Mono","Noto Sans SC",monospace;
  font-size:13px;width:150px}
.tl{font-size:12.5px;padding:5px 0;border-bottom:1px dotted var(--line);display:flex;gap:12px}
.tl .y{color:var(--ink3);flex:0 0 92px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.rev{font-size:12.5px;padding:6px 0;border-bottom:1px dotted var(--line);line-height:1.8}
.T{color:var(--gain)} .F{color:var(--alarm)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
