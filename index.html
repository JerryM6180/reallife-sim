<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现实纪元 · 人生模拟器 DEMO</title>
<style>
  :root{
    --bg:#131519; --card:#1b1e25; --card2:#22262f; --line:#2c313c;
    --tx:#dcdfe5; --dim:#8b929e; --dim2:#666d79;
    --acc:#d9974a; --good:#5fae7a; --bad:#c95f5f; --warn:#c9a45f; --blue:#6b8fc4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font:14px/1.7 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;}
  body{padding:18px 14px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:17px;font-weight:600;letter-spacing:.14em;margin:0 0 2px}
  .sub{color:var(--dim2);font-size:11.5px;letter-spacing:.08em;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:12px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  /* 状态栏 */
  .hd{display:flex;justify-content:space-between;align-items:baseline;
      border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px}
  .hd .t{font-size:16px;font-weight:600;letter-spacing:.06em}
  .hd .a{color:var(--dim);font-size:12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;font-size:13px}
  .row .k{color:var(--dim2);flex:0 0 62px}
  .row .v{text-align:right;color:var(--tx)}
  .bar{height:7px;background:#000;border-radius:4px;overflow:hidden;margin:5px 0 2px}
  .bar i{display:block;height:100%;transition:width .35s}
  .barlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim2)}
  .sect{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .sect .h{font-size:11px;color:var(--dim2);letter-spacing:.16em;margin-bottom:7px}
  .chip{display:inline-block;background:var(--card2);border:1px solid var(--line);
        border-radius:4px;padding:1px 7px;font-size:11.5px;color:var(--dim);margin:0 4px 4px 0}
  .chip.bad{color:var(--bad);border-color:#4a2c2c}
  .skill{display:flex;align-items:center;gap:7px;font-size:12px;margin:3px 0}
  .skill .n{flex:0 0 34px;color:var(--dim2)}
  .skill .b{flex:1;height:4px;background:#000;border-radius:3px;overflow:hidden}
  .skill .b i{display:block;height:100%;background:var(--blue)}
  .skill .v{flex:0 0 26px;text-align:right;color:var(--dim2);font-size:11px}

  /* 主区 */
  .month{font-size:12px;color:var(--dim2);letter-spacing:.1em;margin-bottom:9px}
  .msg{padding:7px 0;border-bottom:1px solid #23262e;white-space:pre-wrap}
  .msg:last-child{border-bottom:none}
  .msg.hi{color:var(--acc)}
  .flow{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim2)}
  .flow span{display:inline-block;margin-right:12px}
  .flow .p{color:var(--good)} .flow .m{color:var(--bad)}
  .empty{color:var(--dim2);font-style:normal}

  /* 传闻 */
  .rum{font-size:12.5px;padding:5px 0;border-bottom:1px solid #23262e;display:flex;gap:8px}
  .rum:last-child{border-bottom:none}
  .rum .s{color:var(--blue);flex:0 0 auto}
  .rum .st{color:var(--warn);flex:0 0 auto;letter-spacing:1px}
  .rum .vd{color:var(--dim2)}

  /* 行动 */
  .verbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .verb{background:var(--card2);border:1px solid var(--line);color:var(--dim);
        padding:5px 13px;border-radius:5px;cursor:pointer;font-size:13px;font-family:inherit}
  .verb:hover{color:var(--tx);border-color:#404757}
  .verb.on{background:var(--acc);border-color:var(--acc);color:#1a1206;font-weight:600}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media(max-width:560px){.acts{grid-template-columns:1fr}}
  .act{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);
       padding:8px 11px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:13px;transition:.12s}
  .act:hover{border-color:var(--acc);background:#282c36}
  .act .hint{display:block;color:var(--dim2);font-size:11.5px;line-height:1.5;margin-top:2px}
  .foot{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .btn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 13px;
       border-radius:5px;cursor:pointer;font-family:inherit;font-size:12.5px}
  .btn:hover{color:var(--tx);border-color:#404757}
  .btn.main{background:var(--acc);border-color:var(--acc);color:#1a1206;font-weight:600}
  .btn:disabled{opacity:.35;cursor:default}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(8,9,11,.86);display:flex;align-items:center;
        justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border:1px solid #3a4150;border-radius:9px;padding:20px 22px;
         max-width:560px;width:100%;max-height:86vh;overflow:auto}
  .modal h2{margin:0 0 4px;font-size:15px;letter-spacing:.1em;color:var(--acc)}
  .modal .tier{font-size:10.5px;color:var(--dim2);letter-spacing:.14em;margin-bottom:12px}
  .modal .body{white-space:pre-wrap;margin-bottom:16px;line-height:1.85}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
       color:var(--tx);padding:10px 13px;border-radius:5px;cursor:pointer;margin-bottom:7px;
       font-family:inherit;font-size:13.5px}
  .opt:hover{border-color:var(--acc);background:#282c36}
  .opt .s{display:block;color:var(--dim2);font-size:11.5px;margin-top:2px}

  /* 开局 & 结局 */
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
  @media(max-width:640px){.pick{grid-template-columns:1fr}}
  .pk{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);
      padding:10px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px}
  .pk:hover{border-color:var(--acc)}
  .pk.on{border-color:var(--acc);background:#2a2620}
  .pk .d{display:block;color:var(--dim2);font-size:11.5px;line-height:1.55;margin-top:3px}
  .pk .n{display:block;color:var(--warn);font-size:11.5px;line-height:1.55;margin-top:4px}
  input[type=text]{background:#0e1013;border:1px solid var(--line);color:var(--tx);padding:7px 10px;
    border-radius:5px;font-family:inherit;font-size:13px;width:150px}
  .tl{font-size:12.5px;padding:4px 0;border-bottom:1px solid #23262e;display:flex;gap:10px}
  .tl .y{color:var(--dim2);flex:0 0 74px}
  .rev{font-size:12.5px;padding:5px 0;border-bottom:1px solid #23262e}
  .T{color:var(--good)} .F{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/rng.js"></script>
<script src="js/content.js"></script>
<script src="js/tracks_a.js"></script>
<script src="js/tracks_b.js"></script>
<script src="js/tracks_c.js"></script>
<script src="js/jobtracks.js"></script>
<script src="js/jobevents_a.js"></script>
<script src="js/jobevents_b.js"></script>
<script src="js/jobevents_c.js"></script>
<script src="js/events2.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
